# 插件版本
pluginVersion=1.0.7

# 构建用的 JDK：优先使用本机 IDEA 自带的 JBR，避免额外安装 JDK
org.gradle.java.installations.paths=D:\\Software\\IntelliJ IDEA 2026.2.0.1\\jbr

# 本机 IDEA 安装目录。留空则从 JetBrains CDN 下载对应平台的 IDE（约 1GB+）
# 若你的 IDEA 装在其他位置，改成实际路径即可
ideaLocalPath=D:/Software/IntelliJ IDEA 2026.2.0.1

# 兼容的 IDEA 版本范围（262 = 2026.2）
pluginSinceBuild=262
pluginUntilBuild=262.*

# 本机没装 IDEA 时，从 CDN 下载的目标平台版本
platformVersion=2026.2

org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
